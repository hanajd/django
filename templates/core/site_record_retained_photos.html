{% extends "base.html" %}

{% block page_title %}留存照片{% endblock %}

{% block content %}
<div class="mx-auto max-w-6xl space-y-6">
    <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
        <div class="min-w-0">
            <p class="text-xs font-semibold uppercase tracking-wider text-slate-500">原始记录</p>
            <h1 class="mt-1 text-2xl font-semibold tracking-tight text-slate-900">留存照片</h1>
            <p class="mt-1 text-sm text-slate-600 break-all">{{ display_name }}</p>
            <p class="mt-0.5 text-xs text-slate-400">仅展示提交批次 photos 目录中的现场留存图，不含签名与布局图。</p>
        </div>
        <div class="flex flex-wrap gap-2 shrink-0">
            <a href="{{ back_url }}" class="inline-flex items-center gap-1.5 rounded-xl border border-slate-200 bg-white px-3.5 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">
                <i class="ri-arrow-left-line"></i> 返回列表
            </a>
            <a href="{{ preview_url }}" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 rounded-xl bg-slate-900 px-3.5 py-2 text-sm font-medium text-white hover:bg-slate-800">
                <i class="ri-eye-line"></i> 预览记录
            </a>
        </div>
    </div>

    {% if photos %}
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        {% for item in photos %}
        <figure class="rounded-2xl border border-slate-200 bg-white overflow-hidden shadow-sm">
            <a href="{{ item.preview_url }}" target="_blank" rel="noopener" class="block bg-slate-50 aspect-[4/3] overflow-hidden">
                <img src="{{ item.raw_url }}" alt="{{ item.file.original_name }}"
                     class="h-full w-full object-contain" loading="lazy">
            </a>
            <figcaption class="px-3 py-2.5 flex items-center justify-between gap-2 border-t border-slate-100">
                <span class="text-xs text-slate-600 truncate" title="{{ item.file.original_name }}">{{ item.file.original_name }}</span>
                <a href="{{ item.download_url }}" class="shrink-0 text-xs font-medium text-indigo-600 hover:text-indigo-800">下载</a>
            </figcaption>
        </figure>
        {% endfor %}
    </div>
    {% else %}
    <div class="rounded-2xl border border-dashed border-slate-200 bg-white px-6 py-16 text-center">
        <i class="ri-image-line text-3xl text-slate-300"></i>
        <p class="mt-3 text-sm text-slate-500">该记录对应提交批次暂无留存照片</p>
    </div>
    {% endif %}
</div>
{% endblock %}
