                row.appendChild(actions);
                row.addEventListener('click', ev => {
                    if (ev.target.closest('button') || ev.target.closest('.field-row-label-input')) return;
                    clearAllRowHighlights();
                    setRowHighlightForField(f.id, true);
                    selectedFieldId = f.id;
                    updateSelectedFieldRows();
                    scrollFieldIntoView(f.id);
                });
                row.addEventListener('mouseenter', () => setCanvasHoverForField(f.id, true));
                row.addEventListener('mouseleave', () => setCanvasHoverForField(f.id, false));
                el.appendChild(row);
            });
            updateFieldBadges();
            if (formulaModalOpen) renderFormulaPanel();
        }

        function removeField(id) {
            const idx = fields.findIndex(f => f.id === id);
            if (idx === -1) return;
            const item = fields[idx];
            if (item.wrap) item.wrap.remove();
            else item.el?.remove();
            fields.splice(idx, 1);
            if (selectedFieldId === id) {
                selectedFieldId = null;
                closeFormulaModal();
            }
            refreshFieldList();
            applyAllNamingMarks();
        }

        function fieldWantsJustifiedInstrumentText(field) {
            if (!field) return false;
            const parts = [field.id, field.placeholder, field.originalPlaceholder].filter(Boolean);
            return parts.some(s => String(s).includes('检测仪器'));
        }

        function fitInputStyle(input, field) {
            const maxFs = 10.5;
            let fs = maxFs;
            input.style.lineHeight = '1.2';
            input.style.paddingLeft = '4px';
            input.style.paddingRight = '4px';
            input.style.paddingTop = '0px';
            input.style.paddingBottom = '0px';
            input.style.fontSize = fs + 'pt';

            // 先使用固定五号字，让文本按宽度自然自动换行；
            // 仅当高度放不下时，才逐步缩小字号。
            while (fs >= 5 && input.scrollHeight > input.clientHeight + 1) {
                input.style.fontSize = fs + 'pt';
                fs -= 0.5;
            }
            if (fs < 5) {
                input.style.fontSize = '5pt';
            }
            input.style.textAlign = fieldWantsJustifiedInstrumentText(field) ? 'justify' : 'center';
            const overflowY = input.scrollHeight > input.clientHeight + 1;
            if (overflowY) {
                input.style.paddingTop = '1px';
                input.style.paddingBottom = '1px';
                return;
            }
            const freeHeight = input.clientHeight - input.scrollHeight;
            const topPad = Math.max(1, Math.floor(freeHeight / 2));
            const bottomPad = Math.max(1, Math.ceil(freeHeight / 2));
            input.style.paddingTop = topPad + 'px';
            input.style.paddingBottom = bottomPad + 'px';
        }

        function mountField(f) {
            f.wrap?.remove();
            f.el?.remove();
            f.wrap = null;
            f.badgeEl = null;
            const meta = pageMeta[f.page];
            if (!meta) return;
            const l = (f.x * meta.scale) + 'px';
            const t = (f.y * meta.scale) + 'px';
            const w = (f.w * meta.scale) + 'px';
            const h = (f.h * meta.scale) + 'px';
            const fieldType = f.fieldType || 'text';
            const typeKey = fieldTypeKey(fieldType);

            const wrap = document.createElement('div');
            wrap.className = 'field-wrap type-' + typeKey;
            if (fieldType === 'text' && f.redText) {
                wrap.classList.add('field-wrap--red-text');
            }
            wrap.style.left = l;
            wrap.style.top = t;
            wrap.style.width = w;
            wrap.style.height = h;
            wrap.dataset.fieldId = f.id;

            const badge = document.createElement('span');
            badge.className = 'field-badge';
            badge.textContent = String(fields.indexOf(f) + 1);
            f.badgeEl = badge;
            attachFieldHoverSync(wrap, f.id);

            if (fieldType === 'check') {
                const box = document.createElement('div');
                box.className = 'check-box';
                box.textContent = f.checked ? '✓' : '';
                box.onclick = () => {
                    f.checked = !f.checked;
                    box.textContent = f.checked ? '✓' : '';
                };
                wrap.appendChild(badge);
                wrap.appendChild(box);
                wrap.addEventListener('mousedown', (ev) => {
                    if (ev.target === box) return;
                    selectedFieldId = f.id;
                    clearAllRowHighlights();
                    setRowHighlightForField(f.id, true);
                    updateSelectedFieldRows();
                    if (formulaModalOpen) renderFormulaPanel();
                });
                meta.pageDiv.appendChild(wrap);
                f.wrap = wrap;
                f.el = box;
                updateFieldBadges();
                syncFieldLabelToCanvas(f);
                return;
            }

            if (fieldType === 'image') {
                const box = document.createElement('div');
                box.className = 'image-box';
                if (f.imageData) {
                    const img = document.createElement('img');
                    img.src = f.imageData;
                    box.appendChild(img);
                } else {
                    box.textContent = (f.placeholder && String(f.placeholder).trim()) ? f.placeholder : '点击上传图片';
                }
                box.onclick = () => {
                    pendingImageField = f;
                    imageFilePicker.click();
                };
                wrap.appendChild(badge);
                wrap.appendChild(box);
                wrap.addEventListener('mousedown', (ev) => {
                    if (ev.target === box || ev.target.tagName === 'IMG') return;
                    selectedFieldId = f.id;
                    clearAllRowHighlights();
                    setRowHighlightForField(f.id, true);
                    updateSelectedFieldRows();
                    if (formulaModalOpen) renderFormulaPanel();
                });
                meta.pageDiv.appendChild(wrap);
                f.wrap = wrap;
                f.el = box;
                updateFieldBadges();
                syncFieldLabelToCanvas(f);
                return;
            }

            const i = document.createElement('textarea');
            i.className = 'input-box';
            i.placeholder = f.placeholder;
            i.value = f.value || '';
            i.rows = 1;
            i.oninput = () => {
                f.value = i.value;
                fitInputStyle(i, f);
            };
            i.addEventListener('focus', () => {
                selectedFieldId = f.id;
                clearAllRowHighlights();
                setRowHighlightForField(f.id, true);
                updateSelectedFieldRows();
                if (formulaModalOpen) renderFormulaPanel();
            });
            wrap.addEventListener('mousedown', (ev) => {
                if (ev.target === i) return;
                selectedFieldId = f.id;
                clearAllRowHighlights();
                setRowHighlightForField(f.id, true);
                updateSelectedFieldRows();
                if (formulaModalOpen) renderFormulaPanel();
            });
            wrap.appendChild(badge);
            wrap.appendChild(i);
            meta.pageDiv.appendChild(wrap);
            f.wrap = wrap;
            f.el = i;
            updateFieldBadges();
            syncFieldLabelToCanvas(f);
            requestAnimationFrame(() => fitInputStyle(i, f));
        }

        function renderPdfAndFields(pdfUrl, loadedFields = []) {
            pdfReady = false;
            closeFormulaModal();
            fields = (loadedFields || []).map(f => {
                const normalized = normalizeFieldSize(f);
                if (!Object.prototype.hasOwnProperty.call(normalized, 'originalPlaceholder')) {
                    normalized.originalPlaceholder = normalized.placeholder || '';
                }
                if (!Object.prototype.hasOwnProperty.call(normalized, 'fieldExpression')) {
                    normalized.fieldExpression = '';
                } else {
                    normalized.fieldExpression = String(normalized.fieldExpression || '').trim();
                }
                if (!normalized.judgmentCriteriaByTestType || typeof normalized.judgmentCriteriaByTestType !== 'object') {
                    normalized.judgmentCriteriaByTestType = { acceptance: '', status: '' };
                } else {
                    normalized.judgmentCriteriaByTestType = {
                        acceptance: normalized.judgmentCriteriaByTestType.acceptance != null
                            ? String(normalized.judgmentCriteriaByTestType.acceptance) : '',
                        status: normalized.judgmentCriteriaByTestType.status != null
                            ? String(normalized.judgmentCriteriaByTestType.status) : ''
                    };
                }
                if (!Object.prototype.hasOwnProperty.call(normalized, 'judgmentCriteriaManual')) {
                    normalized.judgmentCriteriaManual = false;
                } else {
                    normalized.judgmentCriteriaManual = !!normalized.judgmentCriteriaManual;
                }
                if (normalized.title == null) normalized.title = '';
                return normalized;
            });
            ensureUniqueFieldIds(fields);
            fieldIdSeq = fields.length ? Math.max(...fields.map(f => parseInt(f.id.slice(1)) || 0)) + 1 : 1;
            marks = [];
            markerSeq = 1;
            pdfContainer.innerHTML = '';
            pageMeta = {};

            pdfjsLib.getDocument(pdfUrl).promise.then(async doc => {
                pdfDoc = doc;
                const viewportWidth = pdfScroll.clientWidth - 40;
                const firstPage = await doc.getPage(1);
                const baseViewport = firstPage.getViewport({ scale: 1 });
                const scale = viewportWidth / baseViewport.width;

                for (let p = 1; p <= doc.numPages; p++) {
                    const page = await doc.getPage(p);
                    const vp = page.getViewport({ scale: scale });
                    const div = document.createElement('div');
                    div.className = 'pdf-page';
                    div.style.width = vp.width + 'px';
                    div.style.height = vp.height + 'px';
                    pdfContainer.appendChild(div);

                    const canvas = document.createElement('canvas');
                    canvas.width = vp.width;
                    canvas.height = vp.height;
                    div.appendChild(canvas);

                    await page.render({
                        canvasContext: canvas.getContext('2d'),
                        viewport: vp
                    }).promise;

                    pageMeta[p] = {
                        viewport: vp,
                        pageDiv: div,
                        scale: scale,
                        realWidth: baseViewport.width,
                        realHeight: baseViewport.height
                    };
                    const textContent = await page.getTextContent();
                    const textItems = [];
                    textContent.items.forEach(it => {
                        if (!it || !it.str) return;
                        const tx = pdfjsLib.Util.transform(vp.transform, it.transform);
                        const x = tx[4] / scale;
                        const yBottom = tx[5] / scale;
                        const h = (Math.abs(tx[3]) / scale) || Number(it.height || 0);
                        const w = Number(it.width || 0) / scale;
                        const y = yBottom - h;
                        textItems.push({
                            str: String(it.str || '').trim(),
                            x, y, w, h,
                            cx: x + (w / 2),
                            cy: y + (h / 2)
                        });
                    });
                    pageMeta[p].textItems = textItems;
                    div.addEventListener('mousedown', e => startDraw(e, p));
                }
                fields.forEach(f => mountField(f));
                renderMarks();
                refreshFieldList();
                applyFieldsVisibility();
                setDrawMode(false);
                pdfReady = true;
            });
        }

        function setDrawMode(on, fieldType = 'text') {
            drawMode = on;
            currentFieldType = fieldType;
            if (btnMarkPrefix) btnMarkPrefix.classList.toggle('active', on && fieldType === 'prefix');
            if (btnFillRight) btnFillRight.classList.toggle('active', on && fieldType === 'fillRight');
            if (btnFillLeft) btnFillLeft.classList.toggle('active', on && fieldType === 'fillLeft');
            btnAddText.classList.toggle('active', on && fieldType === 'text');
            btnAddCheck.classList.toggle('active', on && fieldType === 'check');
            btnAddImage.classList.toggle('active', on && fieldType === 'image');
            Object.values(pageMeta).forEach(m => m.pageDiv.classList.toggle('draw-mode', on));
        }

        function applyFieldsVisibility() {
            pdfContainer.classList.toggle('hide-fields', !showFieldsOnCanvas);
            btnToggleFields.textContent = showFieldsOnCanvas ? '隐藏填写框' : '显示填写框';
        }

        function renderMarks() {
            document.querySelectorAll('.keyword-mark').forEach(el => el.remove());
            marks.forEach(mark => {
                const meta = pageMeta[mark.page];
                if (!meta || !meta.pageDiv) return;
                const el = document.createElement('div');
                const markerTypeClass = mark.type === 'fillRight' ? 'type-right' : (mark.type === 'fillLeft' ? 'type-left' : 'type-prefix');
                el.className = 'keyword-mark ' + markerTypeClass;
                el.style.left = (mark.x * meta.scale) + 'px';
                el.style.top = (mark.y * meta.scale) + 'px';
                el.style.width = (mark.w * meta.scale) + 'px';
                el.style.height = (mark.h * meta.scale) + 'px';
                const label = document.createElement('span');
                label.className = 'keyword-mark-label';
                const title = mark.type === 'fillRight' ? '向右填' : (mark.type === 'fillLeft' ? '向左填' : '前缀');
                label.textContent = `${title}: ${mark.text || ''}`;
                el.appendChild(label);
                meta.pageDiv.appendChild(el);
                mark.el = el;
            });
        }

        function getKeywordTextInRect(pageNo, realX, realY, realW, realH) {
            const meta = pageMeta[pageNo];
            if (!meta || !Array.isArray(meta.textItems) || !meta.textItems.length) return '';
            const x2 = realX + realW;
            const y2 = realY + realH;
            const hits = meta.textItems.filter(t => {
                const tx2 = t.x + t.w;
                const ty2 = t.y + t.h;
                return !(tx2 < realX || t.x > x2 || ty2 < realY || t.y > y2);
            });
            hits.sort((a, b) => (Math.abs(a.cy - b.cy) <= 2 ? a.cx - b.cx : a.cy - b.cy));
            return hits.map(t => t.str).join('').replace(/\s+/g, '').trim();
        }

        function normalizeNamePiece(text) {
            const raw = String(text || '').trim().replace(/^_+|_+$/g, '');
            if (!raw) return '';
            // 有些场景文字会带历史占位符，定位命名时只取首段，避免残留“_原名”
            return raw.split('_')[0].trim();
        }

        function extractLocatorNumber(text) {
            const raw = String(text || '').trim();
            if (!raw) return null;
            const normalized = raw.replace(/[０-９]/g, ch => String(ch.charCodeAt(0) - 65248));
            const m = normalized.match(/\d+/);
            if (!m) return null;
            const n = Number(m[0]);
            if (!Number.isInteger(n) || n <= 0) return null;
            return n;
        }

        function getFieldsInReadingOrder() {
            return [...fields].sort((a, b) => {
                const ap = Number(a.page) || 0;
                const bp = Number(b.page) || 0;
                if (ap !== bp) return ap - bp;
                const ay = Number(a.y) || 0;
                const by = Number(b.y) || 0;
                if (Math.abs(ay - by) > 1e-6) return ay - by;
                const ax = Number(a.x) || 0;
                const bx = Number(b.x) || 0;
                if (Math.abs(ax - bx) > 1e-6) return ax - bx;
                return String(a.id).localeCompare(String(b.id));
            });
        }

        function getFieldByOrdinal(ordinal) {
            const idx = Number(ordinal) - 1;
            if (!Number.isInteger(idx) || idx < 0) return null;
            const ordered = getFieldsInReadingOrder();
            if (idx >= ordered.length) return null;
            return ordered[idx] || null;
        }

        function getFieldCenter(f) {
            return {
                x: Number(f.x) + Number(f.w) / 2,
                y: Number(f.y) + Number(f.h) / 2
            };
        }

        function isFieldCenterInMarkYRange(field, mark) {
            const meta = pageMeta[field.page];
            if (!meta) return false;
            const centerShowY = getFieldCenter(field).y * Number(meta.scale);
            const markTopShow = Number(mark.y) * Number(meta.scale);
            const markBottomShow = (Number(mark.y) + Number(mark.h)) * Number(meta.scale);
            return centerShowY >= (markTopShow - KEYWORD_ROW_TOLERANCE_PX)
                && centerShowY <= (markBottomShow + KEYWORD_ROW_TOLERANCE_PX);
        }

        function pickTargetFieldByDirection(mark, direction) {
            const markCenterX = Number(mark.x) + Number(mark.w) / 2;
            const markTolerance = 1;
            const candidates = fields
                .filter(f => Number(f.page) === Number(mark.page))
                // 向左/向右填需要同时支持文本框与勾选框命名
                .filter(f => {
                    const t = f.fieldType || 'text';
                    return t === 'text' || t === 'check';
                })
                .filter(f => isFieldCenterInMarkYRange(f, mark))
                .filter(f => {
                    const left = Number(f.x);
                    const right = Number(f.x) + Number(f.w);
                    return direction === 'right'
                        ? left >= (markCenterX - markTolerance)
                        : right <= (markCenterX + markTolerance);
                })
                .sort((a, b) => {
                    const aLeft = Number(a.x);
                    const aRight = Number(a.x) + Number(a.w);
                    const bLeft = Number(b.x);
                    const bRight = Number(b.x) + Number(b.w);
                    const aGap = direction === 'right' ? Math.max(0, aLeft - markCenterX) : Math.max(0, markCenterX - aRight);
                    const bGap = direction === 'right' ? Math.max(0, bLeft - markCenterX) : Math.max(0, markCenterX - bRight);
                    if (aGap !== bGap) return aGap - bGap;
                    // gap 相同场景下再按中心点距离兜底，保证排序稳定
                    const aCenter = getFieldCenter(a).x;
                    const bCenter = getFieldCenter(b).x;
                    return Math.abs(aCenter - markCenterX) - Math.abs(bCenter - markCenterX);
                });
            return candidates[0] || null;
        }

        function applyAllNamingMarks() {
            if (!marks.length) {
                let restored = 0;
                fields.forEach((f, idx) => {
                    if (f.labelUserEdited) return;
                    const fallback = f.originalPlaceholder != null ? String(f.originalPlaceholder) : ('栏位' + idx);
                    if (f.placeholder !== fallback) {
                        f.placeholder = fallback;
                        f.labelRuleNamed = false;
                        syncFieldLabelToCanvas(f);
                        restored += 1;
                    }
                });
                if (restored) refreshFieldList();
                return restored;
            }
            const prefixByField = new Map();
            const rightByField = new Map();
            const leftByField = new Map();
            marks.forEach(mark => {
                const text = normalizeNamePiece(mark.text);
                if (!text) return;
                if (mark.type === 'prefix') {
                    fields.forEach(f => {
                        if (Number(f.page) !== Number(mark.page)) return;
                        if (!isFieldCenterInMarkYRange(f, mark)) return;
                        if (!prefixByField.has(f.id)) prefixByField.set(f.id, []);
                        prefixByField.get(f.id).push({ x: Number(mark.x), text });
                    });
                    return;
                }
                if (mark.type === 'fillRight' || mark.type === 'fillLeft') {
                    let target = null;
                    if (mark.targetFieldId) {
                        target = fields.find(f => f.id === mark.targetFieldId) || null;
                    }
                    if (!target && mark.targetFieldNo) {
                        target = getFieldByOrdinal(mark.targetFieldNo);
                        if (target) mark.targetFieldId = target.id;
                    }
                    // 兼容历史标记：首次应用时自动绑定一次目标输入框，后续不再漂移
                    if (!target) {
                        target = pickTargetFieldByDirection(mark, mark.type === 'fillRight' ? 'right' : 'left');
                        if (target) mark.targetFieldId = target.id;
                    }
                    if (!target) return;
                    const mapRef = mark.type === 'fillRight' ? rightByField : leftByField;
                    if (!mapRef.has(target.id)) mapRef.set(target.id, []);
                    mapRef.get(target.id).push({ x: Number(mark.x), text });
                }
            });

            let changed = 0;
            fields.forEach((f) => {
                if (f.labelUserEdited) return;
                const prefixParts = (prefixByField.get(f.id) || []).sort((a, b) => a.x - b.x).map(x => x.text);
                const rightParts = (rightByField.get(f.id) || []).sort((a, b) => a.x - b.x).map(x => x.text);
                const leftParts = (leftByField.get(f.id) || []).sort((a, b) => a.x - b.x).map(x => x.text);
                const finalParts = [...prefixParts, ...rightParts, ...leftParts].map(normalizeNamePiece).filter(Boolean);
                // 仅修改命中过至少一个规则的输入框；未命中保持当前名称
                if (!finalParts.length) return;
                const next = finalParts.join('_');
                if (f.placeholder !== next) {
                    f.placeholder = next;
                    f.labelRuleNamed = true;
                    syncFieldLabelToCanvas(f);
                    changed += 1;
                }
            });
            if (changed) refreshFieldList();
            return changed;
        }

        function clientToPage(div, x, y) {
            const r = div.getBoundingClientRect();
            return {
                x: x - r.left,
                y: y - r.top
            };
        }

        async function pickTableCellAtPoint(pageNo, realX, realY) {
            const res = await fetch('/files/htmlpdf/api/table-cell-at-point/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ page: pageNo, x: realX, y: realY })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || '定位单元格失败');
            return (data && data.found && data.cell) ? data.cell : null;
        }

        function tryApplyMarkByRect(markType, pageNo, realX, realY, realW, realH) {
            const text = getKeywordTextInRect(pageNo, realX, realY, realW, realH);
            if (!text) {
                alert('未识别到文字，请扩大定位框后重试');
                return true;
            }
            let targetFieldId = null;
            let targetFieldNo = null;
            const locatorNo = extractLocatorNumber(text);
            if (locatorNo) {
                const byNo = getFieldByOrdinal(locatorNo);
                if (byNo) {
                    targetFieldId = byNo.id;
                    targetFieldNo = locatorNo;
                }
            }
            if (markType === 'fillRight' || markType === 'fillLeft') {
                const direction = markType === 'fillRight' ? 'right' : 'left';
                if (!targetFieldId) {
                    const target = pickTargetFieldByDirection(
                        { page: pageNo, x: realX, y: realY, w: realW, h: realH },
                        direction
                    );
                    if (!target) {
                        alert('当前定位未命中可更新的输入框');
                        return true;
                    }
                    targetFieldId = target.id;
                }
            }
            if (markType === 'prefix') {
                targetFieldId = null;
                targetFieldNo = null;
            }
            marks.push({
                id: 'mk' + (markerSeq++),
                type: markType,
                page: pageNo,
                x: realX,
                y: realY,
                w: realW,
                h: realH,
                text,
                targetFieldId,
                targetFieldNo
            });
            renderMarks();
            const changed = applyAllNamingMarks();
            if (!changed) alert('当前定位未命中可更新的输入框');
            return true;
        }

        function addTextFieldByRect(pageNo, realX, realY, realW, realH) {
            const f = {
                id: nextId(),
                page: pageNo,
                x: realX,
                y: realY,
                w: realW,
                h: realH,
                placeholder: '栏位' + fields.length,
                originalPlaceholder: '栏位' + fields.length,
                fieldType: 'text',
                value: '',
                checked: false,
                imageData: '',
                fieldExpression: '',
                judgmentCriteriaByTestType: { acceptance: '', status: '' },
                judgmentCriteriaManual: false,
                title: ''
            };
            normalizeFieldSize(f);
            fields.push(f);
            mountField(f);
            refreshFieldList();
            applyAllNamingMarks();
        }

        async function startDraw(e, p) {
            if (!drawMode || e.button !== 0 || e.target.closest('.field-wrap')) return;
            const meta = pageMeta[p];
            const pt = clientToPage(meta.pageDiv, e.clientX, e.clientY);
            const realX = pt.x / meta.scale;
            const realY = pt.y / meta.scale;
            if (currentFieldType === 'check') {
                const showSize = 18;
                const realSize = showSize / meta.scale;
                const f = {
                    id: nextId(),
                    page: p,
                    x: (pt.x - showSize / 2) / meta.scale,
                    y: (pt.y - showSize / 2) / meta.scale,
                    w: realSize,
                    h: realSize,
                    placeholder: '勾选' + fields.length,
                    originalPlaceholder: '勾选' + fields.length,
                    fieldType: 'check',
                    value: '',
                    checked: false,
                    imageData: '',
                    fieldExpression: '',
                    judgmentCriteriaByTestType: { acceptance: '', status: '' },
                    judgmentCriteriaManual: false,
                    title: ''
                };
                normalizeFieldSize(f);
                fields.push(f);
                mountField(f);
                refreshFieldList();
                applyAllNamingMarks();
                e.preventDefault();
                return;
            }
            drawPage = p;
            drawPending = true;
            drawActive = false;
            drawStart = pt;
            window.addEventListener('mousemove', onDraw);
            window.addEventListener('mouseup', stopDraw);
            e.preventDefault();
        }

        function onDraw(e) {
            if (!drawPending && !drawActive) return;
            const pt = clientToPage(pageMeta[drawPage].pageDiv, e.clientX, e.clientY);
            if (!drawActive) {
                const dx = pt.x - drawStart.x;
                const dy = pt.y - drawStart.y;
                if ((dx * dx + dy * dy) < (DRAW_START_THRESHOLD_PX * DRAW_START_THRESHOLD_PX)) {
                    return;
                }
                drawActive = true;
                drawPending = false;
                bandEl = document.createElement('div');
                bandEl.className = 'rubber-band';
                pageMeta[drawPage].pageDiv.appendChild(bandEl);
            }
            const l = Math.min(drawStart.x, pt.x),
                t = Math.min(drawStart.y, pt.y);
            const w = Math.abs(pt.x - drawStart.x),
                h = Math.abs(pt.y - drawStart.y);
            bandEl.style.cssText = `left:${l}px;top:${t}px;width:${w}px;height:${h}px`;
        }

        async function stopDraw(e) {
            if (!drawPending && !drawActive) return;
            window.removeEventListener('mousemove', onDraw);
            window.removeEventListener('mouseup', stopDraw);
            const meta = pageMeta[drawPage];
            const pt = clientToPage(meta.pageDiv, e.clientX, e.clientY);
            const clickRealX = pt.x / meta.scale;
            const clickRealY = pt.y / meta.scale;

            // 非拖动：仅执行“单击定位单元格”，不进入手动画框。
            if (!drawActive) {
                drawPending = false;
                if (currentFieldType === 'text' || currentFieldType === 'prefix' || currentFieldType === 'fillRight' || currentFieldType === 'fillLeft') {
                    try {
                        const cell = await pickTableCellAtPoint(drawPage, clickRealX, clickRealY);
                        if (cell) {
                            if (currentFieldType === 'text') {
                                addTextFieldByRect(drawPage, Number(cell.x), Number(cell.y), Number(cell.w), Number(cell.h));
                            } else {
                                tryApplyMarkByRect(currentFieldType, drawPage, Number(cell.x), Number(cell.y), Number(cell.w), Number(cell.h));
                            }
                        }
                    } catch (err) {
                        console.warn(err);
                    }
                }
                return;
            }

            const showX = Math.min(drawStart.x, pt.x);
            const showY = Math.min(drawStart.y, pt.y);
            const showW = Math.abs(pt.x - drawStart.x);
            const showH = Math.abs(pt.y - drawStart.y);
            const realX = showX / meta.scale;
            const realY = showY / meta.scale;
            const realW = showW / meta.scale;
            const realH = showH / meta.scale;

            if (bandEl) bandEl.remove();
            bandEl = null;
            drawActive = false;
            drawPending = false;
            if (showW >= 15 && showH >= 15) {
                if (currentFieldType === 'prefix' || currentFieldType === 'fillRight' || currentFieldType === 'fillLeft') {
                    tryApplyMarkByRect(currentFieldType, drawPage, realX, realY, realW, realH);
                    return;
                }
                if (currentFieldType === 'text') {
                    addTextFieldByRect(drawPage, realX, realY, realW, realH);
                    return;
                }
                const f = {
                    id: nextId(),
                    page: drawPage,
                    x: realX,
                    y: realY,
                    w: realW,
                    h: realH,
                    placeholder: '栏位' + fields.length,
                    originalPlaceholder: '栏位' + fields.length,
                    fieldType: currentFieldType,
                    value: '',
                    checked: false,
                    imageData: '',
                    fieldExpression: '',
                    judgmentCriteriaByTestType: { acceptance: '', status: '' },
                    judgmentCriteriaManual: false,
                    title: ''
                };
                normalizeFieldSize(f);
                fields.push(f);
                mountField(f);
                refreshFieldList();
                applyAllNamingMarks();
            }
        }

        function importContentPayload(d) {
            if (!pdfDoc || !pdfReady) {
                alert('模板 PDF 尚未加载完成，请稍后重试。');
                return;
            }
            if (!fields.length) {
                alert('请先点击「从文件库载入版式」，再使用「载入已保存的填写内容」');
                return;
            }
            const contentMap = d.content || {};
            const fieldContentMap = {};
            (d.fields || []).forEach(item => {
                if (!item || !item.id) return;
                if (Object.prototype.hasOwnProperty.call(item, 'content')) {
                    fieldContentMap[item.id] = item.content || '';
                }
                if (Object.prototype.hasOwnProperty.call(item, 'checked')) {
                    fieldContentMap[item.id + '__checked'] = !!item.checked;
                }
                if (Object.prototype.hasOwnProperty.call(item, 'imageData')) {
                    fieldContentMap[item.id + '__imageData'] = item.imageData || '';
                }
            });
            fields.forEach(f => {
                if (f.fieldType === 'check') {
                    if (Object.prototype.hasOwnProperty.call(fieldContentMap, f.id + '__checked')) {
                        f.checked = !!fieldContentMap[f.id + '__checked'];
                    } else if (Object.prototype.hasOwnProperty.call(contentMap, f.id)) {
                        f.checked = !!contentMap[f.id];
                    }
                    if (f.el) f.el.textContent = f.checked ? '✓' : '';
                    return;
                }
                if (f.fieldType === 'image') {
                    if (Object.prototype.hasOwnProperty.call(fieldContentMap, f.id + '__imageData')) {
                        f.imageData = fieldContentMap[f.id + '__imageData'] || '';
                        mountField(f);
                    }
                    return;
                }
                if (Object.prototype.hasOwnProperty.call(contentMap, f.id)) {
                    f.value = contentMap[f.id] || '';
                } else if (Object.prototype.hasOwnProperty.call(fieldContentMap, f.id)) {
                    f.value = fieldContentMap[f.id] || '';
                } else {
                    return;
                }
                if (f.el) {
                    f.el.value = f.value;
                    fitInputStyle(f.el, f);
                }
            });
        }

        function buildFieldsPayload() {
            return fields.map(i => {
                const row = {

                if (i.checkboxPair && typeof i.checkboxPair === 'object') row.checkboxPair = i.checkboxPair;
                if (i.labelUserEdited) row.labelUserEdited = true;

                if (acc || st) {

            });

        function rectIoU(a, b) {
            const ax0 = Number(a.x), ay0 = Number(a.y), ax1 = ax0 + Number(a.w), ay1 = ay0 + Number(a.h);
            const bx0 = Number(b.x), by0 = Number(b.y), bx1 = bx0 + Number(b.w), by1 = by0 + Number(b.h);
            const iw = Math.max(0, Math.min(ax1, bx1) - Math.max(ax0, bx0));
            const ih = Math.max(0, Math.min(ay1, by1) - Math.max(ay0, by0));
            const inter = iw * ih;
            if (inter <= 0) return 0;
            const areaA = Math.max(1e-6, (ax1 - ax0) * (ay1 - ay0));
            const areaB = Math.max(1e-6, (bx1 - bx0) * (by1 - by0));
            return inter / (areaA + areaB - inter);
        }

        async function syncAutoRedNamesBeforeSave() {
            const redFields = fields.filter(f => (f.fieldType || 'text') === 'text' && !!f.redText);
            if (!redFields.length) return;
            try {
                const res = await fetch('/files/htmlpdf/api/auto-red-text-boxes/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({})
                });
                const data = await parseJsonResponseOrThrow(res, '保存前同步红字命名失败');
                const detected = Array.isArray(data.fields) ? data.fields : [];
                if (!detected.length) return;
                redFields.forEach(f => {
                    if (f.labelUserEdited || f.labelPersistedFromFile || f.labelRuleNamed) return;
                    const candidates = detected.filter(d => Number(d.page) === Number(f.page));
                    let best = null;
                    let bestScore = 0;
                    candidates.forEach(d => {
                        const score = rectIoU(f, d);
                        if (score > bestScore) {
                            bestScore = score;
                            best = d;
                        }
                    });
                    const nextName = best && bestScore >= 0.55 ? String(best.placeholder || '').trim() : '';
                    if (!nextName) return;
                    f.placeholder = nextName;
                    f.originalPlaceholder = nextName;
                    syncFieldLabelToCanvas(f);
                });
                refreshFieldList();
            } catch (err) {
                console.warn(err);
            }
        }

        async function parseJsonResponseOrThrow(response, defaultErrorMessage) {
            const contentType = String(response.headers.get('content-type') || '').toLowerCase();
            if (response.redirected && response.url && response.url.includes('/login/')) {
                throw new Error('登录已过期，请重新登录后再保存');
            }
            if (!contentType.includes('application/json')) {
                const text = await response.text();
                if (text && text.includes('<!DOCTYPE')) {
                    throw new Error('接口返回了登录页或错误页，请重新登录后重试');
                }
                throw new Error(defaultErrorMessage || '接口返回非 JSON 内容');
            }
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || defaultErrorMessage || '请求失败');
            return data;
        }

            const payload = {
                fields: fields.map(i => ({
                    page: i.page,
                    x0: i.x,
                    y0: i.y,
                    x1: i.x + i.w,
                    y1: i.y + i.h,
                    fieldType: i.fieldType || 'text',
                    value: i.value || '',
                    checked: !!i.checked,
                    imageData: i.imageData || ''
                })),
                output_category: outputCategory
            };
            fetch('/files/htmlpdf/api/save-pdf/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'same-origin',
                body: JSON.stringify(payload)
            }).then(async r => {
                const d = await parseJsonResponseOrThrow(r, '保存PDF失败');
                const where = d.saved_to === 'report' ? '报告' : '现场记录';
                alert(`已填写 PDF 已保存到文件库「${where}」分类`);
                if (d.file && d.file.library_url) {
                    window.open(d.file.library_url, '_blank');
                }
            }).catch(err => alert(err.message));
        };
            pdfContainer.addEventListener('focusin', e => {
            const ta = e.target.closest('.input-box');
            if (!ta || !pdfContainer.contains(ta)) return;
            const wrap = ta.closest('.field-wrap');
            if (!wrap || !wrap.dataset.fieldId) return;
            selectedFieldId = wrap.dataset.fieldId;
            clearAllRowHighlights();
            setRowHighlightForField(wrap.dataset.fieldId, true);
            updateSelectedFieldRows();
            if (formulaModalOpen) renderFormulaPanel();
            const row = document.querySelector('.field-row[data-field-id="' + wrap.dataset.fieldId + '"]');
            if (row) row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        });

        pdfContainer.addEventListener('click', e => {
            const wrap = e.target.closest('.field-wrap');
            if (!wrap || !wrap.dataset.fieldId) {
                clearAllRowHighlights();
                return;
            }
            if (e.target.closest('.input-box')) return;
            selectedFieldId = wrap.dataset.fieldId;
            clearAllRowHighlights();
            setRowHighlightForField(wrap.dataset.fieldId, true);
            updateSelectedFieldRows();
            if (formulaModalOpen) renderFormulaPanel();
            const row = document.querySelector('.field-row[data-field-id="' + wrap.dataset.fieldId + '"]');
            if (row) row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        });

        setDrawMode(false);
        const pathMatch = window.location.pathname.match(/\/files\/htmlpdf\/editor\/(\d+)\/?$/);
        const initialTemplatePdfId = Number(
            window.HTMLPDF_INITIAL_TEMPLATE_PDF_ID || (pathMatch ? pathMatch[1] : 0)
        );
        if (initialTemplatePdfId) {
            fetch('/files/htmlpdf/api/use-template-pdf/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ template_id: initialTemplatePdfId })
            })
                .then(async r => {
                    const d = await r.json();
                    if (!r.ok) throw new Error(d.error || '加载模板 PDF 失败');
                    if (!d.pdf_url) throw new Error('模板 PDF 地址缺失');
                    const lids = Array.isArray(d.linked_library_task_ids) ? d.linked_library_task_ids : [];
                    if (lids.length) {
                        templateContext.libraryTaskId = String(lids[0]);
                        templateContext.libraryTemplateFileId = '';
                    }
                    renderPdfAndFields(d.pdf_url, []);
                })
                .catch(err => alert(err.message));
        }
        refreshTemplateJsonOptions().catch(err => console.warn(err));
    </script>
</body>
</html>
