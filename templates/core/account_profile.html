{% extends 'base.html' %}

{% block page_title %}个人信息{% endblock %}

{% block content %}
<div class="mx-auto max-w-3xl space-y-6">
    <div>
        <p class="text-xs font-semibold uppercase tracking-wider text-slate-500">个人</p>
        <h1 class="mt-1 text-2xl font-semibold tracking-tight text-slate-900">个人信息管理</h1>
        <p class="mt-1 text-sm leading-relaxed text-slate-600">
            修改本人资料与登录密码。用户名与角色不可在此变更。
        </p>
    </div>

    <form method="post" class="space-y-6">
        {% csrf_token %}

        <section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm ring-1 ring-slate-900/[0.04] sm:p-8">
            <h2 class="text-lg font-semibold text-slate-900">账号资料</h2>
            <div class="mt-6 grid gap-4 sm:grid-cols-2">
                <label class="block sm:col-span-2">
                    <span class="text-sm font-medium text-slate-800">用户名</span>
                    <input type="text" value="{{ user.username }}" disabled
                           class="mt-1.5 w-full rounded-xl border border-slate-200 bg-slate-100 px-3 py-2.5 text-sm text-slate-600">
                </label>
                <label class="block">
                    <span class="text-sm font-medium text-slate-800">角色</span>
                    <input type="text" value="{{ role_name }}" disabled
                           class="mt-1.5 w-full rounded-xl border border-slate-200 bg-slate-100 px-3 py-2.5 text-sm text-slate-600">
                </label>
                <label class="block">
                    <span class="text-sm font-medium text-slate-800">组织部门</span>
                    <input type="text" value="{{ org_unit_label|default:'—' }}" disabled
                           class="mt-1.5 w-full rounded-xl border border-slate-200 bg-slate-100 px-3 py-2.5 text-sm text-slate-600">
                </label>
                <label class="block">
                    <span class="text-sm font-medium text-slate-800">姓</span>
                    <input type="text" name="first_name" value="{{ user.first_name }}"
                           class="mt-1.5 w-full rounded-xl border border-slate-200 bg-slate-50/80 px-3 py-2.5 text-sm shadow-sm focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-100">
                </label>
                <label class="block">
                    <span class="text-sm font-medium text-slate-800">名</span>
                    <input type="text" name="last_name" value="{{ user.last_name }}"
                           class="mt-1.5 w-full rounded-xl border border-slate-200 bg-slate-50/80 px-3 py-2.5 text-sm shadow-sm focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-100">
                </label>
                <label class="block sm:col-span-2">
                    <span class="text-sm font-medium text-slate-800">邮箱</span>
                    <input type="email" name="email" value="{{ user.email }}"
                           class="mt-1.5 w-full rounded-xl border border-slate-200 bg-slate-50/80 px-3 py-2.5 text-sm shadow-sm focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-100">
                </label>
                <label class="block">
                    <span class="text-sm font-medium text-slate-800">手机号</span>
                    <input type="text" name="phone" value="{{ profile.phone|default:'' }}"
                           class="mt-1.5 w-full rounded-xl border border-slate-200 bg-slate-50/80 px-3 py-2.5 text-sm shadow-sm focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-100">
                </label>
                <label class="block">
                    <span class="text-sm font-medium text-slate-800">工号</span>
                    <input type="text" name="employee_no" value="{{ profile.employee_no|default:'' }}"
                           class="mt-1.5 w-full rounded-xl border border-slate-200 bg-slate-50/80 px-3 py-2.5 text-sm shadow-sm focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-100">
                </label>
                <label class="block">
                    <span class="text-sm font-medium text-slate-800">部门（展示）</span>
                    <input type="text" name="department" value="{{ profile.department|default:'' }}"
                           class="mt-1.5 w-full rounded-xl border border-slate-200 bg-slate-50/80 px-3 py-2.5 text-sm shadow-sm focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-100">
                </label>
                <label class="block">
                    <span class="text-sm font-medium text-slate-800">职位</span>
                    <input type="text" name="position" value="{{ profile.position|default:'' }}"
                           class="mt-1.5 w-full rounded-xl border border-slate-200 bg-slate-50/80 px-3 py-2.5 text-sm shadow-sm focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-100">
                </label>
            </div>
        </section>

        <section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm ring-1 ring-slate-900/[0.04] sm:p-8">
            <h2 class="text-lg font-semibold text-slate-900">修改密码</h2>
            <p class="mt-1 text-sm text-slate-600">不改密码请全部留空。</p>
            <div class="mt-6 grid gap-4 sm:grid-cols-1">
                <label class="block">
                    <span class="text-sm font-medium text-slate-800">当前密码</span>
                    <input type="password" name="current_password" autocomplete="current-password"
                           class="mt-1.5 w-full rounded-xl border border-slate-200 bg-slate-50/80 px-3 py-2.5 text-sm shadow-sm focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-100">
                </label>
                <label class="block">
                    <span class="text-sm font-medium text-slate-800">新密码</span>
                    <input type="password" name="new_password" autocomplete="new-password"
                           class="mt-1.5 w-full rounded-xl border border-slate-200 bg-slate-50/80 px-3 py-2.5 text-sm shadow-sm focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-100">
                </label>
                <label class="block">
                    <span class="text-sm font-medium text-slate-800">确认新密码</span>
                    <input type="password" name="new_password_confirm" autocomplete="new-password"
                           class="mt-1.5 w-full rounded-xl border border-slate-200 bg-slate-50/80 px-3 py-2.5 text-sm shadow-sm focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-100">
                </label>
            </div>
        </section>

        <div class="flex flex-wrap items-center gap-3">
            <button type="submit"
                    class="inline-flex items-center gap-2 rounded-xl bg-slate-900 px-4 py-2.5 text-sm font-medium text-white shadow-sm transition hover:bg-slate-800">
                <i class="ri-save-line text-lg"></i>
                保存
            </button>
            <a href="{% url 'dashboard' %}" class="text-sm text-slate-500 hover:text-slate-800">返回首页</a>
        </div>
    </form>
</div>
{% endblock %}
