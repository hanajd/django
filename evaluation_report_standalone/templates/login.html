{% extends "base.html" %}
{% block title %}登录 · 评价报告 Standalone{% endblock %}
{% block unauth_content %}
<div class="mx-auto mt-20 max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
    <h1 class="text-xl font-semibold text-slate-900">评价报告 Standalone</h1>
    <p class="mt-1 text-sm text-slate-500">登录后测试评价报告制作流程</p>
    <form method="post" class="mt-6 space-y-4">
        {% csrf_token %}
        {% if form.errors %}
        <p class="text-sm text-red-600">用户名或密码错误</p>
        {% endif %}
        <div>
            <label class="block text-sm text-slate-600">用户名</label>
            <input type="text" name="username" autofocus required
                   class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
        </div>
        <div>
            <label class="block text-sm text-slate-600">密码</label>
            <input type="password" name="password" required
                   class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
        </div>
        <button type="submit"
                class="w-full rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-medium text-white hover:bg-indigo-700">
            登录
        </button>
    </form>
    <p class="mt-4 text-xs text-slate-400">默认账号见 README（bootstrap 命令创建）</p>
</div>
{% endblock %}
