{% extends 'base.html' %}

{# 使用 edit_user 表示正在编辑的账号；勿用 user，否则会与 auth 上下文里的 request.user 混淆 #}
{% block page_title %}{% if edit_user %}编辑用户{% else %}创建用户{% endif %}{% endblock %}

{% block content %}
<div class="bg-white rounded-lg shadow p-6">
    <form method="post">
        {% csrf_token %}
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- 基本信息 -->
            <div>
                <h3 class="text-lg font-semibold text-gray-800 mb-4">基本信息</h3>
                
                <div class="space-y-4">
                    <div>
                        <label for="username" class="block text-sm font-medium text-gray-700 mb-1">用户名 <span class="text-red-500">*</span></label>
                        <input 
                            type="text" 
                            name="username" 
                            id="username" 
                            value="{% if edit_user %}{{ edit_user.username }}{% endif %}"
                            {% if edit_user %}readonly{% endif %}
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                            required
                        >
                    </div>
                    
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">邮箱</label>
                        <input 
                            type="email" 
                            name="email" 
                            id="email" 
                            value="{% if edit_user %}{{ edit_user.email }}{% endif %}"
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                        >
                    </div>
                    
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">密码 {% if not edit_user %}<span class="text-red-500">*</span>{% endif %}</label>
                        <input 
                            type="password" 
                            name="password" 
                            id="password" 
                            placeholder="{% if edit_user %}留空则不修改密码{% else %}请输入密码{% endif %}"
                            {% if not edit_user %}required{% endif %}
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                        >
                    </div>
                    
                    <div>
                        <label for="first_name" class="block text-sm font-medium text-gray-700 mb-1">姓</label>
                        <input 
                            type="text" 
                            name="first_name" 
                            id="first_name" 
                            value="{% if edit_user %}{{ edit_user.first_name }}{% endif %}"
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                        >
                    </div>
                    
                    <div>
                        <label for="last_name" class="block text-sm font-medium text-gray-700 mb-1">名</label>
                        <input 
                            type="text" 
                            name="last_name" 
                            id="last_name" 
                            value="{% if edit_user %}{{ edit_user.last_name }}{% endif %}"
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                        >
                    </div>
                </div>
            </div>
            
            <!-- 详细信息 -->
            <div>
                <h3 class="text-lg font-semibold text-gray-800 mb-4">详细信息</h3>
                
                <div class="space-y-4">
                    <div>
                        <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">手机号</label>
                        <input 
                            type="text" 
                            name="phone" 
                            id="phone" 
                            value="{% if profile %}{{ profile.phone }}{% endif %}"
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                        >
                    </div>
                    
                    <div>
                        <label for="department" class="block text-sm font-medium text-gray-700 mb-1">部门</label>
                        <input 
                            type="text" 
                            name="department" 
                            id="department" 
                            value="{% if profile %}{{ profile.department }}{% endif %}"
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                        >
                    </div>
                    
                    <div>
                        <label for="position" class="block text-sm font-medium text-gray-700 mb-1">职位</label>
                        <input 
                            type="text" 
                            name="position" 
                            id="position" 
                            value="{% if profile %}{{ profile.position }}{% endif %}"
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                        >
                    </div>
                    
                    <div>
                        <label for="role" class="block text-sm font-medium text-gray-700 mb-1">角色</label>
                        <select 
                            name="role" 
                            id="role" 
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                        >
                            <option value="">请选择角色</option>
                            {% for role in roles %}
                            <option value="{{ role.id }}" {% if profile and profile.role.id == role.id %}selected{% endif %}>
                                {{ role.name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 操作按钮 -->
        <div class="mt-6 flex justify-end space-x-4">
            <a href="{% url 'user_list' %}" class="px-4 py-2 border border-gray-300 rounded-md hover:bg-gray-50 transition-colors">
                取消
            </a>
            <button 
                type="submit" 
                class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors"
            >
                保存
            </button>
        </div>
    </form>
</div>
{% endblock %}
