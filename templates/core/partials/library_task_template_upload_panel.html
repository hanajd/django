{# 当前任务模板：上传 PDF（自动配对同名 JSON）并绑定 #}
<div class="rounded-2xl border border-indigo-200/90 bg-gradient-to-br from-indigo-50/40 to-white p-5 shadow-sm space-y-4">
    <div class="flex flex-wrap items-start justify-between gap-3">
        <div>
            <p class="text-xs text-slate-600 leading-relaxed max-w-md">
                选择 <strong>PDF</strong>（可选同名 <code class="text-[11px] bg-white px-1 rounded">.json</code>）上传后将<strong>自动绑定</strong>到本模板。批量导入请用页顶「批量导入模板文件夹」。
            </p>
        </div>
        {% if manage_task %}
        <span class="text-[11px] px-2.5 py-1 rounded-full bg-white ring-1 ring-indigo-100 text-indigo-800 font-mono shrink-0">{{ manage_task.code }}</span>
        {% endif %}
    </div>
    <form method="post" enctype="multipart/form-data" class="flex flex-wrap items-end gap-4">
        {% csrf_token %}
        <input type="hidden" name="action" value="upload_task_template_files">
        <input type="hidden" name="manage_task_id" value="{{ manage_task.id }}">
        <input type="hidden" name="edit" value="1">
        {% if fl_path %}<input type="hidden" name="fl_path" value="{{ fl_path }}">{% endif %}
        {% if rp %}<input type="hidden" name="return_project" value="{{ rp }}">{% endif %}
        <label class="flex-1 min-w-[16rem] cursor-pointer">
            <span class="block text-xs font-medium text-slate-600 mb-1.5">选择文件（可多选）</span>
            <span class="flex items-center gap-3 rounded-xl border-2 border-dashed border-indigo-200 bg-white px-4 py-5 hover:border-indigo-400 hover:bg-indigo-50/30 transition-colors">
                <span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-red-50 text-red-600">
                    <i class="ri-file-pdf-2-line text-xl"></i>
                </span>
                <span class="min-w-0 text-left">
                    <span class="block text-sm font-medium text-slate-800">点击选择 PDF / JSON</span>
                    <span class="block text-[11px] text-slate-500 mt-0.5">例：<span class="font-mono">CT验收.pdf</span> 与可选 <span class="font-mono">CT验收.json</span></span>
                </span>
            </span>
            <input type="file" name="template_files" accept=".pdf,.json,application/pdf,application/json" multiple class="sr-only">
        </label>
        <button type="submit" class="px-5 py-2.5 rounded-xl bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700 shadow-sm">上传并绑定</button>
    </form>
</div>
