{% extends 'base.html' %}

{% block page_title %}删除用户{% endblock %}

{% block content %}
<div class="bg-white rounded-lg shadow p-6">
    <div class="max-w-md">
        <div class="flex items-center mb-4">
            <div class="p-3 bg-red-100 rounded-full">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
            </div>
            <h3 class="ml-4 text-lg font-semibold text-gray-800">确认删除</h3>
        </div>
        
        <p class="text-gray-600 mb-6">
            您确定要删除用户 <strong>{{ user.username }}</strong> 吗？此操作无法撤销。
        </p>
        
        <form method="post">
            {% csrf_token %}
            
            <div class="flex justify-end space-x-4">
                <a href="{% url 'user_list' %}" class="px-4 py-2 border border-gray-300 rounded-md hover:bg-gray-50 transition-colors">
                    取消
                </a>
                <button 
                    type="submit" 
                    class="px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700 transition-colors"
                >
                    确认删除
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
