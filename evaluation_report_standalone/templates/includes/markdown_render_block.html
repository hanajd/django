<style>
.md-preview-root { max-width: 100%; }
.md-preview-root h1 { font-size: 1.5rem; font-weight: 700; margin: 1rem 0 0.5rem; line-height: 1.3; }
.md-preview-root h2 { font-size: 1.25rem; font-weight: 600; margin: 0.85rem 0 0.35rem; line-height: 1.35; }
.md-preview-root h3 { font-size: 1.1rem; font-weight: 600; margin: 0.65rem 0 0.25rem; }
.md-preview-root h4, .md-preview-root h5, .md-preview-root h6 { font-size: 1rem; font-weight: 600; margin: 0.5rem 0 0.2rem; }
.md-preview-root p { margin: 0.5rem 0; line-height: 1.65; }
.md-preview-root ul, .md-preview-root ol { margin: 0.5rem 0 0.5rem 1.25rem; padding-left: 0.25rem; }
.md-preview-root ul { list-style-type: disc; }
.md-preview-root ol { list-style-type: decimal; }
.md-preview-root li { margin: 0.2rem 0; }
.md-preview-root pre { background: #f8fafc; padding: 0.75rem 1rem; border-radius: 0.375rem; overflow-x: auto; border: 1px solid #e2e8f0; margin: 0.65rem 0; }
.md-preview-root code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 0.875em; background: #f1f5f9; padding: 0.1em 0.35em; border-radius: 0.25rem; }
.md-preview-root pre code { background: transparent; padding: 0; font-size: 0.8125rem; }
.md-preview-root table { border-collapse: collapse; width: 100%; margin: 0.65rem 0; font-size: 0.9rem; }
.md-preview-root th, .md-preview-root td { border: 1px solid #e5e7eb; padding: 0.4rem 0.55rem; text-align: left; vertical-align: top; }
.md-preview-root th { background: #f9fafb; font-weight: 600; }
.md-preview-root blockquote { border-left: 4px solid #cbd5e1; margin: 0.65rem 0; padding: 0.25rem 0 0.25rem 1rem; color: #64748b; }
.md-preview-root a { color: #2563eb; text-decoration: underline; }
.md-preview-root hr { margin: 1rem 0; border: 0; border-top: 1px solid #e5e7eb; }
.md-preview-root img { max-width: 100%; height: auto; }
.md-preview-root strong { font-weight: 700; }
</style>
{{ md_payload|json_script:payload_id }}
<div id="{{ root_id }}" class="md-preview-root text-slate-800 overflow-auto max-h-[calc(100vh-14rem)] text-sm"></div>
<p id="{{ root_id }}-fallback" class="hidden text-xs text-amber-700 mt-2">无法加载渲染脚本，已显示纯文本。</p>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
<script>
(function () {
    var payloadId = "{{ payload_id|escapejs }}";
    var rootId = "{{ root_id|escapejs }}";
    var el = document.getElementById(payloadId);
    var root = document.getElementById(rootId);
    var note = document.getElementById(rootId + '-fallback');
    if (!el || !root) return;
    var data = {};
    try { data = JSON.parse(el.textContent); } catch (e) { data = {}; }
    var raw = (data && data.text) ? data.text : '';
    if (typeof marked === 'undefined' || typeof DOMPurify === 'undefined') {
        root.innerHTML = '';
        var pre = document.createElement('pre');
        pre.className = 'whitespace-pre-wrap break-words font-mono text-sm';
        pre.textContent = raw;
        root.appendChild(pre);
        if (note) note.classList.remove('hidden');
        return;
    }
    marked.setOptions({ gfm: true, breaks: true });
    var html = marked.parse(raw);
    root.innerHTML = DOMPurify.sanitize(html, { ADD_TAGS: ['table', 'thead', 'tbody', 'tr', 'th', 'td'], ADD_ATTR: ['rowspan', 'colspan'] });
})();
</script>
