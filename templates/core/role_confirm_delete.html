{% extends 'base.html' %}

{% block page_title %}删除角色{% endblock %}

{% block content %}
<div class="mx-auto max-w-lg">
    <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm ring-1 ring-slate-900/[0.04] sm:p-8">
        <div class="flex items-start gap-4">
            <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl bg-red-100 text-red-600">
                <i class="ri-error-warning-line text-2xl"></i>
            </div>
            <div class="min-w-0 flex-1">
                <h3 class="text-lg font-semibold text-slate-900">确认删除角色</h3>
                <p class="mt-2 text-sm leading-relaxed text-slate-600">
                    将永久删除角色 <strong class="text-slate-900">{{ role.name }}</strong>（<code class="rounded bg-slate-100 px-1 text-xs font-mono">{{ role.code }}</code>），此操作无法撤销。
                </p>
                {% if role.user_count %}
                <p class="mt-3 rounded-lg border border-amber-200 bg-amber-50 px-3 py-2 text-sm text-amber-950">
                    当前仍有 <strong>{{ role.user_count }}</strong> 名用户的资料关联此角色；删除后这些用户的角色字段将置空，请事先为其重新分配角色。
                </p>
                {% endif %}
            </div>
        </div>
        
        <form method="post" class="mt-8 flex flex-wrap justify-end gap-3 border-t border-slate-100 pt-6">
            {% csrf_token %}
            <a href="{% url 'role_list' %}" class="inline-flex items-center justify-center rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-medium text-slate-700 shadow-sm transition hover:bg-slate-50">
                取消
            </a>
            <button 
                type="submit" 
                class="inline-flex items-center justify-center rounded-xl bg-red-600 px-4 py-2.5 text-sm font-medium text-white shadow-sm transition hover:bg-red-700"
            >
                确认删除
            </button>
        </form>
    </div>
</div>
{% endblock %}
