{# guide_page: index 或各节 slug；guide_nav_items: [{slug, title}, ...] #}
<nav id="guide-site-nav" class="rounded-xl border border-slate-200 bg-slate-50/80 px-4 py-3 text-sm lg:sticky lg:top-20 lg:z-[5]" aria-label="使用说明分页目录">
    <div class="flex flex-col gap-3 lg:flex-row lg:flex-wrap lg:items-start lg:justify-between">
        <div class="min-w-0 flex-1">
            <span class="font-medium text-slate-800">说明分页</span>
            <span class="mt-2 flex flex-wrap gap-x-1 gap-y-1">
                <a href="{% url 'backend_usage_guide' %}" class="inline-flex rounded-md px-2 py-1 {% if guide_page == 'index' %}bg-indigo-100 font-semibold text-indigo-900{% else %}text-indigo-600 hover:bg-white hover:underline{% endif %}">总览</a>
                {% for item in guide_nav_items %}
                    <a href="{% url 'backend_usage_guide_page' page=item.slug %}"{% if forloop.first %} id="guide-nav-first-chapter"{% endif %} class="inline-flex rounded-md px-2 py-1 {% if guide_page == item.slug %}bg-indigo-100 font-semibold text-indigo-900{% else %}text-indigo-600 hover:bg-white hover:underline{% endif %}">{{ item.title }}</a>
                {% endfor %}
            </span>
        </div>
        <a href="{% url 'backend_usage_guide' %}" class="shrink-0 text-xs text-slate-500 hover:text-indigo-600 lg:pt-1">返回总览</a>
    </div>
</nav>
