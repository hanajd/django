{% extends 'base.html' %}

{% block login_content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-100">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <i class="ri-dashboard-line text-3xl text-white"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">平板 App 后台管理系统</h1>
            <p class="text-gray-500 mt-2">请登录您的账户</p>
        </div>
        
        <form method="post">
            {% csrf_token %}
            
            <div class="mb-6">
                <label for="username" class="block text-gray-700 text-sm font-medium mb-2">用户名</label>
                <div class="relative">
                    <i class="ri-user-line absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    <input 
                        type="text" 
                        name="username" 
                        id="username" 
                        placeholder="请输入用户名"
                        class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                        required
                    >
                </div>
            </div>
            
            <div class="mb-6">
                <label for="password" class="block text-gray-700 text-sm font-medium mb-2">密码</label>
                <div class="relative">
                    <i class="ri-lock-line absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    <input 
                        type="password" 
                        name="password" 
                        id="password" 
                        placeholder="请输入密码"
                        class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                        required
                    >
                </div>
            </div>
            
            <button 
                type="submit" 
                class="w-full bg-blue-600 text-white py-3 px-4 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-all font-medium"
            >
                登录
            </button>
        </form>
        
        {% if messages %}
        <div class="mt-6">
            {% for message in messages %}
            <div class="px-4 py-3 rounded-lg bg-red-50 text-red-700 border border-red-200 flex items-center space-x-2">
                <i class="ri-error-warning-line"></i>
                <span>{{ message }}</span>
            </div>
            {% endfor %}
        </div>
        {% endif %}
        
        <div class="mt-6 text-center text-sm text-gray-500">
            <p> 2024 平板 App 后台管理系统</p>
        </div>
    </div>
</div>
{% endblock %}
