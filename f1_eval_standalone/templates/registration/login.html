{% extends "base.html" %}
{% block title %}登录 · 评价报告表制作{% endblock %}
{% block page_title %}登录{% endblock %}
{% block content %}
<div class="flex items-center justify-center py-16">
  <div class="w-full max-w-sm bg-white rounded-xl border border-slate-200 shadow-sm p-6">
    <h2 class="text-base font-semibold text-slate-800 mb-4">
      <i class="ri-lock-line text-blue-600 mr-1"></i>登录
    </h2>
    {% if form.errors %}
    <div class="text-xs px-3 py-2 mb-3 rounded-md bg-red-50 border border-red-200 text-red-700">
      用户名或密码不正确，请重试。
    </div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <label class="block text-xs text-slate-600 mb-1">用户名</label>
      <input type="text" name="username" autofocus required
             class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm mb-3 focus:outline-none focus:ring-2 focus:ring-blue-200">
      <label class="block text-xs text-slate-600 mb-1">密码</label>
      <input type="password" name="password" required
             class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm mb-4 focus:outline-none focus:ring-2 focus:ring-blue-200">
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-md py-2">
        登录
      </button>
    </form>
  </div>
</div>
{% endblock %}
