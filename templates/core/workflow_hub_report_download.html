{% extends "base.html" %}

{% block page_title %}报告导出及下载{% endblock %}

{% block content %}
<div class="mx-auto max-w-7xl space-y-6">
    <div class="flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
        <div>
            <p class="text-xs font-semibold uppercase tracking-wider text-slate-500">报告流程 · 下载</p>
            <h1 class="mt-1 text-2xl font-semibold tracking-tight text-slate-900">报告导出及下载</h1>
            <p class="mt-1 text-sm text-slate-600 max-w-2xl">按医院或时间找到委托，预览或下载报告。</p>
        </div>
        <div class="flex flex-wrap gap-2 shrink-0">
            <a href="{% url 'workflow_hub_review_sign' %}?view={{ view_mode|default:'hospital' }}" class="inline-flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">
                <i class="ri-shield-check-line"></i> 审核签发
            </a>
            <a href="{{ file_library_report_url }}" class="inline-flex items-center gap-2 rounded-xl bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700">
                <i class="ri-folder-2-line"></i> 文件库
            </a>
        </div>
    </div>

    {% include "core/partials/workflow_hub_tree.html" %}
</div>
{% endblock %}
